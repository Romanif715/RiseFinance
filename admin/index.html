<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiseFinance — Адмінпанель</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ===== Стилі адмінпанелі (відсутні в style.css) ===== */
    .admin-wrap { max-width: 1180px; margin: auto; padding: 35px 24px 70px; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    .admin-top h1 { margin: 0; font-size: 26px; letter-spacing: -1px; }
    .admin-panel { padding: 25px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); margin: 20px 0; overflow: auto; }
    .admin-panel h2 { font-size: 18px; margin: 0 0 18px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat { padding: 20px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-2); }
    .stat strong { display: block; font-size: 27px; font-weight: 800; }
    .stat span { font-size: 11px; color: var(--muted); }
    .admin-form { display: grid; gap: 12px; max-width: 700px; }
    .admin-form input, .admin-form textarea,
    .login-card input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #0c0b15; color: #fff; font-size: 13px; outline: none; }
    .admin-form input:focus, .admin-form textarea:focus,
    .login-card input:focus { border-color: #a78bfa; }
    .admin-form label, .login-card label { display: grid; gap: 6px; font-size: 12px; color: #ded9ef; font-weight: 600; }
    .admin-btn { border: 1px solid #a78bfa55; background: #8b5cf626; color: #eee5ff; border-radius: 9px; padding: 9px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .admin-btn:hover { background: #8b5cf640; }
    .admin-btn.danger { border-color: #fb718555; background: #fb71851a; color: #fecdd3; }
    .admin-btn.danger:hover { background: #fb718535; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 650px; }
    .admin-table th, .admin-table td { text-align: left; padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .admin-table th { color: #c4b5fd; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
    .admin-table td { color: #d7d3e4; }
    .status { display: inline-block; padding: 4px 8px; border-radius: 20px; background: #f59e0b22; color: #fcd34d; font-size: 10px; font-weight: 700; }
    .status.processed { background: #22c55e20; color: #86efac; }
    .login-card { max-width: 450px; margin: 10vh auto; padding: 32px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .login-card form { display: grid; gap: 15px; margin-top: 18px; }
    .login-card h1 { font-size: 26px; margin: 12px 0 6px; }
    .login-card .logo-wrapper { display: flex; align-items: center; gap: 12px; }
    .login-card .logo-icon { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 13px; background: linear-gradient(135deg, #a78bfa, #6d28d9); }
    .login-card .logo-text { font-weight: 800; font-size: 20px; }
    .small-text { color: var(--muted); font-size: 12px; }
    .alert { padding: 12px; border-radius: 9px; background: #88133733; color: #fecdd3; font-size: 13px; margin: 10px 0; }
    .error-msg { padding: 12px; border-radius: 9px; background: #88133733; color: #fecdd3; font-size: 13px; }
    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .admin-top { flex-direction: column; align-items: flex-start; }
      .admin-wrap { padding: 24px 15px; }
    }
  </style>
</head>
<body>
<div id="app">
  <main class="login-card">
    <p class="small-text">Завантаження…</p>
  </main>
</div>

<script type="module">
import {
  loginAdmin, logoutAdmin, getSession,
  getConsultations, toggleConsultation,
  addNews, deleteNews, getStats, loadNews,
} from '../assets/js/supabase.js';

const app = document.getElementById('app');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

async function render() {
  try {
    const session = await getSession();
    if (session) {
      app.innerHTML = await adminHTML();
    } else {
      app.innerHTML = loginHTML();
    }
    bind();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<main class="login-card"><p class="error-msg">Помилка: ${esc(err.message)}</p></main>`;
  }
}

function loginHTML() {
  return `
    <main class="login-card">
      <a href="../index.html" class="logo-wrapper">
        <span class="logo-icon"><i class="fa-solid fa-building-columns"></i></span>
        <span class="logo-text">RiseFinance</span>
      </a>
      <h1>Вхід адміністратора</h1>
      <p class="small-text">Увійдіть, щоб керувати заявками та новинами.</p>
      <form id="loginForm">
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="consultation-button" type="submit">УВІЙТИ <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="small-text" style="margin-top:16px"><a href="../index.html">← На сайт</a></p>
    </main>`;
}

async function adminHTML() {
  const [consultations, stats, news] = await Promise.all([
    getConsultations(),
    getStats(),
    loadNews(),
  ]);

  return `
    <main class="admin-wrap">
      <div class="admin-top">
        <div>
          <p class="eyebrow">RISEFINANCE / ADMIN</p>
          <h1>Панель керування</h1>
        </div>
        <button id="logoutBtn" class="admin-btn">
          Вийти <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>

      <div class="stats">
        <div class="stat"><strong>${stats.consultations}</strong><span>Усього заявок</span></div>
        <div class="stat"><strong>${stats.new}</strong><span>Нові заявки</span></div>
        <div class="stat"><strong>${stats.subscribers}</strong><span>Підписники</span></div>
        <div class="stat"><strong>${stats.news}</strong><span>Новини</span></div>
      </div>

      <section class="admin-panel">
        <h2><i class="fa-solid fa-inbox"></i> Заявки на консультацію</h2>
        ${!consultations.length ? '<p class="small-text">Заявок поки немає.</p>' : `
        <table class="admin-table">
          <thead><tr><th>Дата</th><th>Клієнт</th><th>Повідомлення</th><th>Статус</th><th>Дія</th></tr></thead>
          <tbody>
            ${consultations.map(c => `
              <tr>
                <td>${esc(new Date(c.created_at).toLocaleString('uk-UA'))}</td>
                <td><strong>${esc(c.name || '—')}</strong><br>${esc(c.email)}</td>
                <td>${esc(c.message || '')}</td>
                <td><span class="status ${c.status === 'processed' ? 'processed' : ''}">${c.status === 'processed' ? 'Опрацьовано' : 'Нова'}</span></td>
                <td><button class="admin-btn toggle-btn" data-id="${c.id}" data-status="${c.status}">Змінити</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </section>

      <section class="admin-panel">
        <h2><i class="fa-solid fa-newspaper"></i> Додати новину</h2>
        <form class="admin-form" id="newsForm">
          <label>Заголовок<input name="title" maxlength="255" required></label>
          <label>Текст новини<textarea name="content" rows="4" required></textarea></label>
          <label>URL зображення (необов’язково)<input name="image" type="url" placeholder="https://example.com/image.jpg"></label>
          <button class="consultation-button" type="submit">ОПУБЛІКУВАТИ <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </section>

      <section class="admin-panel">
        <h2>Опубліковані новини</h2>
        ${!news.length ? '<p class="small-text">Новин поки немає.</p>' : `
        <table class="admin-table">
          <thead><tr><th>Дата</th><th>Заголовок</th><th>Текст</th><th>Дія</th></tr></thead>
          <tbody>
            ${news.map(n => `
              <tr>
                <td>${esc(new Date(n.created_at).toLocaleDateString('uk-UA'))}</td>
                <td>${esc(n.title)}</td>
                <td>${esc((n.content || '').slice(0, 130))}…</td>
                <td><button class="admin-btn danger del-btn" data-id="${n.id}">Видалити</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </section>

      <p class="small-text"><a href="../index.html">← Переглянути сайт</a></p>
    </main>`;
}

function bind() {
  document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      await loginAdmin(e.target.email.value.trim(), e.target.password.value);
      render();
    } catch (err) {
      alert('Помилка входу: ' + err.message);
      btn.disabled = false;
    }
  });

  document.getElementById('logoutBtn')?.addEventListener('click', async () => {
    await logoutAdmin();
    render();
  });

  document.querySelectorAll('.toggle-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      try {
        await toggleConsultation(btn.dataset.id, btn.dataset.status);
        render();
      } catch (err) {
        alert('Помилка: ' + err.message);
      }
    });
  });

  document.querySelectorAll('.del-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('Видалити цю новину?')) return;
      try {
        await deleteNews(btn.dataset.id);
        render();
      } catch (err) {
        alert('Помилка: ' + err.message);
      }
    });
  });

  document.getElementById('newsForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      await addNews({
        title: form.title.value.trim(),
        content: form.content.value.trim(),
        image: form.image.value.trim(),
      });
      form.reset();
      render();
    } catch (err) {
      alert('Помилка: ' + err.message);
      btn.disabled = false;
    }
  });
}

render();
</script>
</body>
</html>
